name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile package
        run: uv run --python ${{ matrix.python-version }} python -m py_compile src/attack3_hud/*.py

      - name: Import smoke test
        run: |
          uv run --python ${{ matrix.python-version }} python -c "from attack3_hud import Attack3Controller, Attack3HUD, ControllerState, Calibration; print('ok')"
          uv run --python ${{ matrix.python-version }} python -c "import attack3_hud; print(attack3_hud.__version__)"

      - name: Build wheel/sdist
        run: uv build
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'

      - name: Check dist metadata
        run: uvx twine check dist/*
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
